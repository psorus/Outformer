mixture: 
    max_feature_dim: 100
    max_model_dim: 100
    inflate_full: False
    gmm:
        max_feature_dim: 100
        max_model_dim: 100
        max_num_cluster: 5
        max_mean: 5
        max_var: 5
        inflate_full: False
        diversity: 5  # for each dim in [2, max_feature_dim], we generate 'diversity' number of them
        percentile: 0.9
    scm_prob:
        max_feature_dim: 100
        min_num_layer: 3
        max_num_layer: 5
        min_hidden_size: 20
        max_hidden_size: 40
        alpha: 1.5
        beta: 4.0
    scm_contextual:
        max_feature_dim: 100
        min_num_layer: 3
        max_num_layer: 5
        min_hidden_size: 20
        max_hidden_size: 40
        alpha: 1.5
        beta: 4.0