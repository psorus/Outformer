name: outformer
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - scikit-learn
  - pandas
  - matplotlib
  - seaborn
  - tqdm
  - pip:
      # PyPI torch wheels for Linux bundle CUDA runtime libraries
      - torch>=2.3
      - pytorch-lightning>=2.2
      - hydra-core>=1.3
      - omegaconf>=2.3
      - einops
      - wandb
      - huggingface_hub  # provides the `hf` CLI for downloading benchmarks
